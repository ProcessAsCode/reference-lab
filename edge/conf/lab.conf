# Edge gateway for the Process-as-Code reference lab.
# Hostnames come from LAB_DOMAIN / LAB_SCHEME; secrets from the environment.
# Nothing in this file is specific to any organisation.

ServerName edge
ProxyPreserveHost On
ProxyTimeout 300

# ── Sign-in: one Keycloak realm for every service, single sign-on across
#    subdomains via a shared session cookie.
OIDCProviderMetadataURL http://keycloak:8080/realms/pac/.well-known/openid-configuration
OIDCClientID            edge
OIDCClientSecret        "${OIDC_CLIENT_SECRET}"
OIDCCryptoPassphrase    "${OIDC_CRYPTO_PASSPHRASE}"
OIDCScope               "openid email profile"
OIDCRemoteUserClaim     preferred_username
OIDCPassClaimsAs        headers
OIDCCookieDomain        ${LAB_DOMAIN}
OIDCSessionInactivityTimeout 3600
OIDCSessionMaxDuration  28800
OIDCXForwardedHeaders   X-Forwarded-Proto X-Forwarded-Host

# ── Web application firewall (OWASP CRS). DetectionOnly by default.
SecRuleEngine ${LAB_WAF_MODE}
SecRequestBodyLimit 104857600

ErrorLog /dev/stderr
CustomLog /dev/stdout combined

# A service that requires a signed-in user. $host is the subdomain,
# $upstream the internal address.
<Macro Protected $host $upstream>
  <VirtualHost *:80>
    ServerName $host.${LAB_DOMAIN}
    OIDCRedirectURI ${LAB_SCHEME}://$host.${LAB_DOMAIN}/oauth2callback
    RequestHeader set X-Forwarded-Proto "${LAB_SCHEME}"
    RequestHeader unset OIDC_access_token
    <Location "/">
      AuthType openid-connect
      Require valid-user
      ProxyPass        $upstream/ upgrade=websocket
      ProxyPassReverse $upstream/
    </Location>
    <Location "/oauth2callback">
      ProxyPass !
      AuthType openid-connect
      Require valid-user
    </Location>
  </VirtualHost>
</Macro>

# ── Landing page: open; lists the services of this lab.
<VirtualHost *:80>
  ServerName ${LAB_DOMAIN}
  DocumentRoot /var/www/lab
  <Directory /var/www/lab>
    Require all granted
  </Directory>
</VirtualHost>

# ── Keycloak itself: never behind sign-in.
<VirtualHost *:80>
  ServerName auth.${LAB_DOMAIN}
  RequestHeader set X-Forwarded-Proto "${LAB_SCHEME}"
  ProxyPass        / http://keycloak:8080/
  ProxyPassReverse / http://keycloak:8080/
</VirtualHost>

# ── Core: process repository
Use Protected processgit http://processgit:3000

# ── Profile "studio": process design
Use Protected studio http://studio-web:80

# ── Profile "dms": document management (frontend proxies its own API)
Use Protected dms http://dms-frontend:80

# ── Profile "legal": contracts and governance. The frontend is served
#    under /app/; everything else is the API.
<VirtualHost *:80>
  ServerName legal.${LAB_DOMAIN}
  OIDCRedirectURI ${LAB_SCHEME}://legal.${LAB_DOMAIN}/oauth2callback
  RequestHeader set X-Forwarded-Proto "${LAB_SCHEME}"
  <Location "/">
    AuthType openid-connect
    Require valid-user
    ProxyPass        http://legal-api:8002/
    ProxyPassReverse http://legal-api:8002/
  </Location>
  <Location "/app/">
    AuthType openid-connect
    Require valid-user
    ProxyPass        http://legal-frontend:80/
    ProxyPassReverse http://legal-frontend:80/
  </Location>
  <Location "/oauth2callback">
    ProxyPass !
    AuthType openid-connect
    Require valid-user
  </Location>
</VirtualHost>

UndefMacro Protected
