<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process-as-Code lab</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e3de; --accent:#2f5d8a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#ececea; --muted:#9a9a94; --card:#1f1f1f; --line:#2e2e2c; --accent:#7fa9d6; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:860px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  a.card { display:block; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:8px; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  .name { font-weight:600; }
  .desc { color:var(--muted); font-size:14px; }
  .tag { display:inline-block; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 6px; margin-top:8px; }
  footer { margin-top:40px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Process-as-Code lab</h1>
  <p class="lead">Processes as versioned UAPF packages, run by AI agents under human control, with every step on the record.</p>
  <div class="grid" id="services"></div>
  <footer>Sign-in is shared across all services. <a href="https://github.com/ProcessAsCode">github.com/ProcessAsCode</a></footer>
</main>
<script>
  const host = location.host, scheme = location.protocol;
  const services = [
    ["processgit", "ProcessGit", "Process packages: versions, review, MCP endpoint", "core"],
    ["studio", "Studio", "Design BPMN, DMN and CMMN models", "profile: studio"],
    ["dms", "OpenDMS", "Document management with process-driven rules", "profile: dms"],
    ["legal", "OpenLegal", "Contracts and governance obligations as code", "profile: legal"],
    ["auth", "Identity", "Users, organisations and roles (Keycloak)", "core"],
  ];
  const grid = document.getElementById("services");
  for (const [sub, name, desc, tag] of services) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `${scheme}//${sub}.${host}/${sub === "legal" ? "app/" : sub === "auth" ? "admin/" : ""}`;
    a.innerHTML = `<div class="name"></div><div class="desc"></div><span class="tag"></span>`;
    a.querySelector(".name").textContent = name;
    a.querySelector(".desc").textContent = desc;
    a.querySelector(".tag").textContent = tag;
    grid.appendChild(a);
  }
</script>
</body>
</html>
