# process-agent configuration for the reference lab. Secrets come from the
# environment (see .env); addresses are the internal service names.

agent:
  id: lab-process-agent
  did: did:web:agent.lab.localhost
  listen: { host: 0.0.0.0, port: 4100 }
  publicBaseUrl: http://process-agent:4100
  apiTokenEnv: AGENT_API_TOKEN

engine:
  url: http://uapf-engine:4000

llm:
  apiKeyEnv: LLM_API_KEY      # base URL and model are set from LLM_GATEWAY_URL / LLM_MODEL

trust:
  auditLog: /app/data/audit.jsonl
  eventSignerUrl: http://event-signer:3100

memory:
  file: /app/data/memory.json

# Bind data.* / document.* capabilities to the MCP tools of the systems you
# run. The names below are illustrative; use the tools your systems expose.
systems:
  servers: {}
  #   dms:
  #     url: http://dms-api:8002/mcp
  #     authEnv: DMS_MCP_NODE_TOKEN
  bindings: {}
  #   "document.fetch@1": { server: dms, tool: get_document, args: { id: "$.documentId" } }
